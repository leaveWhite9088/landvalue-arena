<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地价沙盘</title>
  <link rel="icon" type="image/jpeg" href="/landvalue-tab.jpeg">
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <header id="topbar"></header>
  <div id="workspace" class="rail-collapsed">
    <div id="stage">
      <canvas id="board" aria-label="地价沙盘"></canvas>
      <div id="scrub" hidden></div>
      <div id="hover" hidden></div>
    </div>
    <aside id="rail"></aside>
  </div>
  <dialog id="build"></dialog>
  <dialog id="config"></dialog>
  <div id="popover" class="popover" hidden></div>
  <div id="toast" role="status"></div>
  <div id="boot">
    <div>
      <h2>地价沙盘</h2>
      <p id="boot-msg">正在连接沙盘。</p>
    </div>
  </div>
  <script type="module" src="/web/main.ts"></script>
</body>
</html>
